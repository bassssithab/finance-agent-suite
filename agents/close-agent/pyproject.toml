[project]
name = "close-agent"
version = "0.1.0"
description = "Financial close variance analysis: computes budget-vs-actual variances by line item deterministically, flags those over configurable thresholds, drafts cited explanations for the flagged items, and routes the report to human approval"
requires-python = ">=3.11"
# Own copy of the anthropic SDK, scoped to this agent's folder (CLAUDE.md rule
# #5 — one agent per folder, shared logic only in platform/). This agent calls
# the Claude API directly to draft variance explanations, same as
# agents/ap-agent, agents/vat-treatment-agent and agents/technical-accounting-agent.
dependencies = ["anthropic>=0.40,<1"]

[project.optional-dependencies]
dev = ["pytest>=8"]
